services:
  main:
    depends_on:
      world:
        condition: service_healthy

  world:
    build:
      context: ./world
    environment:
      WORLD_SEED: "4"
      JUDGE_KEY: "${JUDGE_KEY:-}"
      VERIFY_TOKEN: "210e7a8ff99a0d0312a2038e565a09c8920477705cd61a7e"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
