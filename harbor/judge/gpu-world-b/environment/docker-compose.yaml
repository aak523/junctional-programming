services:
  main:
    depends_on:
      world:
        condition: service_healthy

  world:
    build:
      context: ./world
    environment:
      WORLD_SEED: "8"
      JUDGE_KEY: "${JUDGE_KEY:-}"
      VERIFY_TOKEN: "31663904c2ae1e1364004fc1b0ce9e2232434aed0828c452"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
