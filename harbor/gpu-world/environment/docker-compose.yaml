services:
  main:
    depends_on:
      world:
        condition: service_healthy

  world:
    build:
      context: ./world
    environment:
      WORLD_SEED: "20261114"
      VERIFY_TOKEN: "c1a67c437a5fae6bef90d9f013f9d2c6935ee247c7625f04"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
