services:
  main:
    depends_on:
      world:
        condition: service_healthy

  world:
    build:
      context: ./world
    environment:
      WORLD_SEED: "20261114"
      VERIFY_TOKEN: "4387dfd1a71f74a4a08e6cb35bfbf173b3ba8d87b4f0f246"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
